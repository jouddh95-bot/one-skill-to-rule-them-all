name: chargix-fetch
on:
  push:
    branches: [claude/project-thread-extkzj]
    paths: [chargix/jobs/fetch.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get install -y -q ffmpeg webp >/dev/null
      - name: Fetch media and extract frames
        run: python3 chargix/tools/hf-fetch.py chargix/jobs/fetch.json chargix/out/hf
      - name: Commit
        run: |
          git config user.name "chargix-pipeline"; git config user.email "pipeline@users.noreply.github.com"
          git add chargix/out/hf
          git commit -qm "chargix: fetched Higgsfield media [skip ci]" || exit 0
          for t in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 15 + 5)); done
          exit 1
