name: chargix-fetch
on:
  push:
    branches: [claude/project-thread-extkzj]
    paths: [chargix/jobs/fetch.sh]
permissions:
  contents: write
concurrency: { group: chargix-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: mkdir -p chargix/out/fetch && bash chargix/jobs/fetch.sh chargix/out/fetch 2>&1 | tee chargix/out/fetch/log.txt | tail -200
      - name: Commit
        if: always()
        run: |
          git config user.name "chargix-pipeline"; git config user.email "pipeline@users.noreply.github.com"
          git add chargix/out/fetch chargix/assets && git commit -m "chargix: fetch [skip ci]" && git pull --rebase -q && git push
